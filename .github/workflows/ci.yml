name: Go SDK certification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.x", "1.27.1"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - run: bash scripts/check-release-boundary.sh
      - run: bash scripts/check-generated.sh
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: bash scripts/test-wasm-boundary.sh
      - run: bash scripts/test-local-sandbox.sh
      - run: bash scripts/test-package.sh

  analysis:
    name: Static and vulnerability analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: staticcheck ./...
      - run: govulncheck ./...
