name: Release Go SDK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: go-sdk-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.AETHER_GO_SDK_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: sdk-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
          cache: true
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - run: bash scripts/certify.sh
      - run: bash scripts/test-hosted-sandbox.sh
        env:
          AETHER_SDK_SANDBOX_TOKEN_URL: ${{ vars.AETHER_SDK_SANDBOX_TOKEN_URL }}
          AETHER_SDK_SANDBOX_STORAGE_URL: ${{ vars.AETHER_SDK_SANDBOX_STORAGE_URL }}
          AETHER_SDK_SANDBOX_NAMESPACE_ID: ${{ vars.AETHER_SDK_SANDBOX_NAMESPACE_ID }}
          AETHER_SDK_SANDBOX_CLIENT_ID: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_ID }}
          AETHER_SDK_SANDBOX_CLIENT_SECRET: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_SECRET }}
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
